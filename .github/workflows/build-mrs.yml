name: build-mrs

on:
  workflow_dispatch:

  # 北京时间每天 06:00 自动运行
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: build-mrs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python requirements
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Download mihomo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p bin

          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          api = "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          retries = 5
          timeout = 60

          def fetch_json(url):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "mihomo-rule-build/1.0",
              }
              token = os.environ.get("GITHUB_TOKEN")
              if token:
                  headers["Authorization"] = f"Bearer {token}"

              request = urllib.request.Request(url, headers=headers)
              last_error = None

              for attempt in range(1, retries + 1):
                  try:
                      with urllib.request.urlopen(request, timeout=timeout) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as error:
                      last_error = error
                      if error.code not in {408, 429, 500, 502, 503, 504} or attempt == retries:
                          break
                  except (TimeoutError, urllib.error.URLError, OSError) as error:
                      last_error = error
                      if attempt == retries:
                          break

                  delay = 5 * attempt
                  print(f"获取 release 信息失败，{delay}s 后重试: {last_error}", flush=True)
                  time.sleep(delay)

              raise SystemExit(f"获取 mihomo release 信息失败: {last_error}")

          data = fetch_json(api)

          assets = data.get("assets", [])
          candidates = []

          print(f"mihomo release: {data.get('tag_name', 'unknown')}")

          for asset in assets:
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")
              lower = name.lower()

              if (
                  "linux-amd64" in lower
                  and lower.endswith(".gz")
                  and "alpha" not in lower
              ):
                  candidates.append((name, url))

          if not candidates:
              available = "\n".join(
                  f"  - {asset.get('name', '')}" for asset in assets if asset.get("name")
              )
              raise SystemExit(
                  "没有找到 mihomo linux-amd64 .gz 下载文件。可用资产:\n" + available
              )

          # 优先 compatible，兼容性最好
          candidates.sort(key=lambda x: ("compatible" not in x[0].lower(), x[0]))

          print("候选 mihomo 资产:")
          for candidate_name, _ in candidates[:10]:
              print(f"  - {candidate_name}")

          name, url = candidates[0]

          print(f"使用 mihomo: {name}")

          with open("mihomo_asset_url.txt", "w", encoding="utf-8") as f:
              f.write(url)
          PY

          MIHOMO_URL="$(cat mihomo_asset_url.txt)"

          curl \
            --fail \
            --location \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 180 \
            "$MIHOMO_URL" \
            -o mihomo.gz

          gzip -t mihomo.gz
          gzip -dc mihomo.gz > bin/mihomo
          chmod +x bin/mihomo

          ./bin/mihomo -v

      - name: Build MRS and TXT rules
        shell: bash
        env:
          MIHOMO_BIN: ./bin/mihomo
        run: |
          set -euo pipefail

          python scripts/build_mrs.py

          # 不允许 manifest.json 进入 rule/mihomo
          rm -f rule/mihomo/manifest.json

      - name: Commit and push rule changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 如果旧版本提交过 manifest.json，自动从 Git 跟踪中删除
          git rm --ignore-unmatch rule/mihomo/manifest.json || true
          rm -f rule/mihomo/manifest.json

          # 提交 rule/mihomo 下新增、修改、删除
          # 这样 links.txt 删除某个链接后，对应旧 .mrs/.txt 也会被删除
          git add -A rule/mihomo

          # 双保险：不允许 manifest.json 进入提交
          git reset -- rule/mihomo/manifest.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "没有 .mrs 或 .txt 规则变化，不需要提交。"
            exit 0
          fi

          git status --short rule/mihomo
          git commit -m "chore: update mihomo rules"
          git push
